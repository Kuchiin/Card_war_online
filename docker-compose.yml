services:
  frontend:
    build:
      context: ./frontend-wojna-online
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_SOCKET_URL:-http://localhost:4000}
        NEXT_PUBLIC_MQTT_WS_URL: ${PUBLIC_MQTT_WS_URL:-ws://localhost:9001}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_started
      mqtt:
        condition: service_started

  backend:
    build:
      context: ./backend-wojna-online
    environment:
      PORT: 4000
      MQTT_URL: mqtt://mqtt:1883
      DB_PATH: /app/data/database.sqlite
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
    expose:
      - "4000"
    volumes:
      - backend-data:/app/data
    depends_on:
      mqtt:
        condition: service_started

  mqtt:
    image: eclipse-mosquitto:2
    expose:
      - "1883"
      - "9001"
    volumes:
      - ./backend-wojna-online/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
      - mqtt

volumes:
  backend-data:
  mqtt-data:
  mqtt-log:
  caddy-data:
  caddy-config:
