services:
  frontend:
    build:
      context: ./frontend-wojna-online
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_SOCKET_URL:-http://localhost:4000}
        NEXT_PUBLIC_MQTT_WS_URL: ${PUBLIC_MQTT_WS_URL:-ws://localhost:9001}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
      mqtt:
        condition: service_started

  backend:
    build:
      context: ./backend-wojna-online
    environment:
      PORT: 4000
      MQTT_URL: mqtt://mqtt:1883
      DB_PATH: /app/data/database.sqlite
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
    ports:
      - "4000:4000"
    volumes:
      - backend-data:/app/data
    depends_on:
      mqtt:
        condition: service_started

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./backend-wojna-online/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log

volumes:
  backend-data:
  mqtt-data:
  mqtt-log:
